<script src="assets/posts.js"></script>
<script>
  const list = document.getElementById('post-list');
  const tf = document.getElementById('tag-filters');
  const tags = ['All', ...new Set(POSTS.map(p => p.tag))];
  const render = t => list.innerHTML = POSTS.filter(p => t === 'All' || p.tag === t).map(p => postCard(p)).join('');
  tf.innerHTML = tags.map((t,i) => `<button class="${i===0?'on':''}" data-t="${t}">${t}</button>`).join('');
  tf.addEventListener('click', e => {
    if (!e.target.dataset.t) return;
    tf.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target));
    render(e.target.dataset.t);
  });
  render('All');
</script>
<script src="assets/main.js"></script>
